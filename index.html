<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AM Premium — Alight Motion Premium Gratis & Cepat</title>
    <meta name="description" content="Aktivasi Alight Motion Premium cepat dan aman dengan sistem resmi Magic Link sender, Firebase Auth Google, verifikasi oobCode, dan Mode Cepat batch queue." />
    <meta property="og:title" content="AM Premium — Alight Motion Premium Gratis" />
    <meta property="og:description" content="Aktifkan Alight Motion Premium cepat dan aman tanpa root. Cukup login Google Firebase dan verifikasi email akun Anda." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Guaranteed Anti-White Screen: Enforce Dark Background globally with sleek modern styling */
      html, body {
        background-color: #000 !important;
        color: #f5f5f7 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(ellipse 80% 60% at 15% 10%, rgba(120, 80, 255, 0.28), transparent 60%),
          radial-gradient(ellipse 70% 55% at 85% 20%, rgba(0, 200, 255, 0.20), transparent 60%),
          radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255, 60, 180, 0.18), transparent 60%),
          radial-gradient(ellipse 60% 50% at 90% 90%, rgba(60, 255, 200, 0.12), transparent 65%),
          #000;
        animation: floatBg 20s ease-in-out infinite alternate;
      }
      @keyframes floatBg {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.08) translate(-1%, -1%); }
      }
      .bg-grain {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
    </style>
    <script>
      // Global Fail-Safe Error Trap: Prevents any white screen from uncaught script or cache errors
      window.addEventListener('error', function(event) {
        console.error('[AM Activator System Error Caught]:', event.error || event.message);
        var root = document.getElementById('root');
        // Only trigger fallback if React hasn't rendered yet
        if (root && (!root.children || root.children.length <= 1)) {
          var isInitCard = root.querySelector('#init-loader');
          if (isInitCard) {
            isInitCard.innerHTML =
              '<div style="max-width:440px;background:#11121a;border:1px solid #282a3a;border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.5);">' +
              '<div style="font-size:36px;margin-bottom:12px;">⚡</div>' +
              '<h2 style="font-size:16px;font-weight:bold;color:#fff;margin:0 0 8px 0;">Sinkronisasi Cache Dashboard</h2>' +
              '<p style="font-size:12px;color:#94a3b8;line-height:1.5;margin:0 0 16px 0;">Terjadi pembaruan modul bot pada server. Klik tombol di bawah untuk membersihkan cache browser dan membuka dashboard seketika.</p>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="width:100%;background:#2563eb;color:#fff;font-weight:700;font-size:13px;padding:12px 18px;border:none;border-radius:12px;cursor:pointer;transition:background 0.2s;">Bersihkan Cache & Buka Dashboard</button>' +
              '</div>';
          }
        }
      });
    </script>
  </head>
  <body class="bg-[#09090d] text-slate-100 antialiased">
    <div id="root">
      <!-- Instant Pre-Hydration Shell: Guarantees screen is NEVER blank white -->
      <div id="init-loader" style="min-height:100vh;background-color:#09090d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          <div style="width:36px;height:36px;border-radius:10px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 0 15px rgba(37,99,235,0.4);">
            AM
          </div>
          <span style="font-size:17px;font-weight:700;color:#fff;letter-spacing:-0.02em;">AM Activator Pro Bot</span>
        </div>
        <div style="width:200px;height:4px;background:#1e202e;border-radius:99px;overflow:hidden;margin-bottom:12px;">
          <div style="width:50%;height:100%;background:#3b82f6;border-radius:99px;animation:load 1.2s infinite ease-in-out;"></div>
        </div>
        <span style="font-size:11px;color:#64748b;font-family:monospace;">Memuat dashboard...</span>
        <style>
          @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
